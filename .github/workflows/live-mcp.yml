name: Live HA MCP on iOS Simulator

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: live-ha-mcp
  cancel-in-progress: false

jobs:
  live-native-mcp:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Build native simulator MCP acceptance
        run: |
          mkdir -p build/live
          sdk_path="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          sim_arch="$(uname -m)"
          sim_target="$sim_arch-apple-ios17.0-simulator"
          xcrun swiftc -sdk "$sdk_path" -target "$sim_target" \
            -emit-library -static -emit-module -module-name AssistantModels \
            Sources/AssistantModels/*.swift \
            -emit-module-path build/live/AssistantModels.swiftmodule \
            -o build/live/libAssistantModels.a
          xcrun swiftc -sdk "$sdk_path" -target "$sim_target" -I build/live \
            -emit-library -static -emit-module -module-name AssistantMCP \
            Sources/AssistantMCP/*.swift \
            -emit-module-path build/live/AssistantMCP.swiftmodule \
            -o build/live/libAssistantMCP.a
          xcrun swiftc -sdk "$sdk_path" -target "$sim_target" -parse-as-library \
            -I build/live -L build/live -lAssistantMCP -lAssistantModels scripts/LiveMCPSmoke.swift \
            -o build/live/LiveMCPSmoke
      - name: Boot iOS simulator
        run: |
          device_id="$(xcrun simctl list devices available -j | python3 scripts/select_simulator.py --runtime iOS-18-5 --device 'iPhone 16 Pro Max')"
          echo "WOOW_LIVE_SIMULATOR=$device_id" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$device_id" -b
      - name: Read-only HA acceptance inside iOS Simulator
        timeout-minutes: 8
        env:
          SIMCTL_CHILD_WOOW_HA_MCP_TEST_URL: ${{ secrets.WOOW_HA_MCP_TEST_URL }}
        run: |
          test -n "$SIMCTL_CHILD_WOOW_HA_MCP_TEST_URL" || { echo 'Missing private MCP test configuration'; exit 1; }
          xcrun simctl spawn "$WOOW_LIVE_SIMULATOR" "$PWD/build/live/LiveMCPSmoke"
      - name: Build App for live MCP UI tests
        run: |
          tool_dir="$(mktemp -d "$RUNNER_TEMP/woow-xcodegen.XXXXXX")"
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.artifactbundle.zip \
            --output "$tool_dir/xcodegen.artifactbundle.zip"
          (cd "$tool_dir" && echo 'cfa4e1ee82fc4c95bf7bd8f7db1fda6bd073605c76a8d5cbce50c54a81867eb2  xcodegen.artifactbundle.zip' | shasum -a 256 --check)
          unzip -q "$tool_dir/xcodegen.artifactbundle.zip" -d "$tool_dir"
          "$tool_dir/xcodegen.artifactbundle/xcodegen-2.44.1-macosx/bin/xcodegen" generate
          xcodebuild -project WoowAssistant.xcodeproj -scheme WoowAssistant \
            -destination "platform=iOS Simulator,id=$WOOW_LIVE_SIMULATOR" \
            -derivedDataPath build/LiveDerivedData build-for-testing CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES
          codesign --verify --strict build/LiveDerivedData/Build/Products/Debug-iphonesimulator/WoowAssistant.app
          codesign -d --entitlements :- build/LiveDerivedData/Build/Products/Debug-iphonesimulator/WoowAssistant.app
          xcrun simctl list runtimes -j | python3 scripts/prepare_simulator_webkit.py \
            --runtime iOS-18-5 --products build/LiveDerivedData/Build/Products/Debug-iphonesimulator
      - name: Real MCP App discovery and reconnection
        timeout-minutes: 8
        env:
          WOOW_HA_MCP_TEST_URL: ${{ secrets.WOOW_HA_MCP_TEST_URL }}
        run: |
          test_runs=(build/LiveDerivedData/Build/Products/*.xctestrun)
          [ "${#test_runs[@]}" -eq 1 ] || { echo 'Expected one generated test runner'; exit 1; }
          python3 scripts/prepare_live_xctestrun.py "${test_runs[0]}" --service mcp
          xcodebuild -xctestrun "${test_runs[0]}" \
            -destination "platform=iOS Simulator,id=$WOOW_LIVE_SIMULATOR" \
            -only-testing:WoowAssistantUITests/LiveMCPUITests \
            -parallel-testing-enabled NO test-without-building
      - name: Real model selects and invokes approved HA tools in App
        timeout-minutes: 12
        env:
          WOOW_HA_MCP_TEST_URL: ${{ secrets.WOOW_HA_MCP_TEST_URL }}
          WOOW_MODEL_TEST_BASE_URL: ${{ vars.WOOW_MODEL_TEST_BASE_URL }}
          WOOW_MODEL_TEST_MODEL: ${{ vars.WOOW_MODEL_TEST_MODEL }}
          WOOW_MODEL_TEST_API_KEY: ${{ secrets.WOOW_MODEL_TEST_API_KEY }}
        run: |
          test_runs=(build/LiveDerivedData/Build/Products/*.xctestrun)
          [ "${#test_runs[@]}" -eq 1 ] || { echo 'Expected one generated test runner'; exit 1; }
          python3 scripts/prepare_live_xctestrun.py "${test_runs[0]}" --service model
          python3 scripts/prepare_live_xctestrun.py "${test_runs[0]}" --service mcp
          xcodebuild -xctestrun "${test_runs[0]}" \
            -destination "platform=iOS Simulator,id=$WOOW_LIVE_SIMULATOR" \
            -only-testing:WoowAssistantUITests/LiveMCPConversationUITests \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 300 test-without-building
      - name: Clear private runner configuration
        if: always()
        run: |
          for test_run in build/LiveDerivedData/Build/Products/*.xctestrun; do
            [ ! -f "$test_run" ] || python3 scripts/prepare_live_xctestrun.py "$test_run" --service mcp --clear
            [ ! -f "$test_run" ] || python3 scripts/prepare_live_xctestrun.py "$test_run" --service model --clear
          done
      - name: Stop test simulator
        if: always() && env.WOOW_LIVE_SIMULATOR != ''
        run: xcrun simctl shutdown "$WOOW_LIVE_SIMULATOR"
      # Never publish live endpoints, server response bodies or process environments.
