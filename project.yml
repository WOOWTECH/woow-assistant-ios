name: WoowAssistant
options:
  bundleIdPrefix: io.woowtech
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
targets:
  AssistantContracts:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/AssistantContracts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.woowtech.assistant.contracts

  AssistantDomain:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/AssistantDomain
    dependencies:
      - target: AssistantContracts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.woowtech.assistant.domain

  AssistantBrowser:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/AssistantBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.woowtech.assistant.browser

  WoowAssistant:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/App
    dependencies:
      - target: AssistantContracts
      - target: AssistantDomain
      - target: AssistantBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.woowtech.assistant
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 渥屋助理
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"

  AssistantDomainTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/AssistantDomainTests
    dependencies:
      - target: AssistantContracts
      - target: AssistantDomain
      - target: AssistantBrowser

  WoowAssistantUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/WoowAssistantUITests
    dependencies:
      - target: WoowAssistant

schemes:
  WoowAssistant:
    build:
      targets:
        WoowAssistant: all
        AssistantDomainTests: [test]
        WoowAssistantUITests: [test]
    test:
      targets:
        - AssistantDomainTests
        - WoowAssistantUITests
