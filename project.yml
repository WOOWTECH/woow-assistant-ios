name: WoowAssistant
options:
  bundleIdPrefix: io.woowtech
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
targets:
  AssistantContracts:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/AssistantContracts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.woowtech.assistant.contracts

  AssistantDomain:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/AssistantDomain
    dependencies:
      - target: AssistantContracts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.woowtech.assistant.domain

  AssistantBrowser:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/AssistantBrowser
    dependencies:
      - target: AssistantModels
      - target: AssistantSkills
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.woowtech.assistant.browser

  AssistantModels:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/AssistantModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.woowtech.assistant.models

  AssistantMCP:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/AssistantMCP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.woowtech.assistant.mcp

  AssistantMemory:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources/AssistantMemory]
    dependencies:
      - target: AssistantModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.woowtech.assistant.memory

  AssistantSkills:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources/AssistantSkills]
    dependencies:
      - target: AssistantModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.woowtech.assistant.skills

  AssistantPersistence:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources/AssistantPersistence]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.woowtech.assistant.persistence

  WoowAssistant:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/App
    dependencies:
      - target: AssistantContracts
      - target: AssistantDomain
      - target: AssistantBrowser
      - target: AssistantModels
      - target: AssistantMCP
      - target: AssistantMemory
      - target: AssistantSkills
      - target: AssistantPersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.woowtech.assistant
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 渥屋助理
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"

  AssistantDomainTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/AssistantDomainTests
    dependencies:
      - target: AssistantContracts
      - target: AssistantDomain
      - target: AssistantBrowser
      - target: AssistantModels

  AssistantModelsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/AssistantModelsTests
    dependencies:
      - target: AssistantModels

  AssistantMCPTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/AssistantMCPTests
    dependencies:
      - target: AssistantMCP

  AssistantMemoryTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests/AssistantMemoryTests]
    dependencies:
      - target: AssistantMemory

  AssistantSkillsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests/AssistantSkillsTests]
    dependencies:
      - target: AssistantSkills
      - target: AssistantModels

  AssistantPersistenceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests/AssistantPersistenceTests]
    dependencies:
      - target: AssistantPersistence

  WoowAssistantUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/WoowAssistantUITests
    dependencies:
      - target: WoowAssistant

schemes:
  WoowAssistant:
    build:
      targets:
        WoowAssistant: all
        AssistantDomainTests: [test]
        AssistantModelsTests: [test]
        AssistantMCPTests: [test]
        AssistantMemoryTests: [test]
        AssistantSkillsTests: [test]
        AssistantPersistenceTests: [test]
        WoowAssistantUITests: [test]
    test:
      targets:
        - AssistantDomainTests
        - AssistantModelsTests
        - AssistantMCPTests
        - AssistantMemoryTests
        - AssistantSkillsTests
        - AssistantPersistenceTests
        - WoowAssistantUITests
